name: Hello Github Actions
on: [push]

jobs:
  greet:
    runs-on: ubuntu-latest
    env:
      COURSE: CloudComputing
    steps:
      - uses: actions/checkout@v4
      - name: Say Hello
        run: echo "Hello from ${COURSE}!"
      - run: echo "i'll list files"
      - run: ls -al
  goodbye:
    needs: greet
    runs-on: ubuntu-latest
    steps:
      - run: echo "Gooodvye ${COURSE}"
      - run: ls -al
      
